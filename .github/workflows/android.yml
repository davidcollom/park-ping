name: Android checks and test APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
      - name: Check alert behaviour
        run: ./test.sh
      - name: Run Gradle lint and build
        run: ./gradlew --no-daemon lintDebug assembleDebug
      - name: Install pinned bundletool
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
      - name: Create disposable AAB smoke-test key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/park-ping-smoke.p12" \
            -storetype PKCS12 \
            -storepass smoke-test \
            -keypass smoke-test \
            -alias smoke-test \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Park Ping CI Smoke Test'
      - name: Build and verify PR smoke AAB
        env:
          PARKPING_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/park-ping-smoke.p12
          PARKPING_UPLOAD_KEYSTORE_PASSWORD: smoke-test
          PARKPING_UPLOAD_KEY_ALIAS: smoke-test
          PARKPING_UPLOAD_KEY_PASSWORD: smoke-test
        run: |
          export PARKPING_VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          export PARKPING_VERSION_NAME="pr-smoke-${GITHUB_RUN_NUMBER}"
          ./gradlew --no-daemon :app:bundleRelease
          bundle="app/build/outputs/bundle/release/app-release.aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle"
          if ! unzip -Z1 "$bundle" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo 'PR smoke AAB has no signing certificate.' >&2
            exit 1
          fi
          jarsigner -verify "$bundle"
      - uses: actions/upload-artifact@v6
        with:
          name: park-ping-pr-smoke-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Build and verify development APK
        env:
          PARKPING_APK_NAME: park-ping-test.apk
        run: ./build-apk.sh
      - uses: actions/upload-artifact@v6
        with:
          name: park-ping-test-apk
          path: app/build/manual/park-ping-test.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable smoke-test key
        if: always()
        run: rm -f "$RUNNER_TEMP/park-ping-smoke.p12" "$RUNNER_TEMP/bundletool.jar"
