name: Android checks and test APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check alert behaviour
        run: ./test.sh
      - name: Run Gradle lint and build
        run: ./gradlew --no-daemon lintDebug assembleDebug
      - name: Build and verify development APK
        env:
          PARKPING_APK_NAME: park-ping-test.apk
        run: ./build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: park-ping-test-apk
          path: app/build/manual/park-ping-test.apk
          if-no-files-found: error
          retention-days: 14
