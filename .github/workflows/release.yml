name: Tagged Android APK and Play AAB

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check alert behaviour
        run: ./test.sh
      - name: Install pinned bundletool
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
      - name: Prepare optional persistent signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PARKPING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PARKPING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PARKPING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PARKPING_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
              echo 'All four PARKPING signing secrets are required when signing is configured.' >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/park-ping.keystore"
            chmod 600 "$RUNNER_TEMP/park-ping.keystore"
            echo 'persistent=true' >> "$GITHUB_OUTPUT"
          else
            echo 'persistent=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No persistent signing secrets: this development APK may require uninstalling an older build before installation.'
          fi
      - name: Prepare optional Play upload key
        id: upload-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PARKPING_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PARKPING_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PARKPING_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PARKPING_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
              echo 'All four PARKPING_UPLOAD signing secrets are required when signing is configured.' >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/park-ping-upload.p12"
            chmod 600 "$RUNNER_TEMP/park-ping-upload.p12"
            echo 'persistent=true' >> "$GITHUB_OUTPUT"
          else
            echo 'persistent=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No Play upload key configured: the AAB artifact will be unsigned and cannot be uploaded to Play.'
          fi
      - name: Install emulator for generated APK check
        if: steps.upload-signing.outputs.persistent == 'true'
        run: sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Build and verify tagged APK and AAB
        env:
          PARKPING_VERSION_NAME: ${{ github.ref_name }}
          KEYSTORE_PASSWORD: ${{ secrets.PARKPING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PARKPING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PARKPING_KEY_PASSWORD }}
          PERSISTENT_SIGNING: ${{ steps.signing.outputs.persistent }}
          UPLOAD_SIGNING: ${{ steps.upload-signing.outputs.persistent }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PARKPING_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.PARKPING_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.PARKPING_UPLOAD_KEY_PASSWORD }}
        run: |
          export PARKPING_VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          export PARKPING_APK_NAME=park-ping.apk
          if [[ "$PERSISTENT_SIGNING" == true ]]; then
            export PARKPING_KEYSTORE_FILE="$RUNNER_TEMP/park-ping.keystore"
            export PARKPING_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export PARKPING_KEY_ALIAS="$KEY_ALIAS"
            export PARKPING_KEY_PASSWORD="$KEY_PASSWORD"
          fi
          ./build-apk.sh
          mkdir -p dist/release dist/artifact
          if [[ "$PERSISTENT_SIGNING" == true ]]; then
            cp app/build/manual/park-ping.apk dist/release/park-ping.apk
          else
            cp app/build/manual/park-ping.apk dist/release/park-ping-development.apk
          fi
          export PARKPING_UPLOAD_KEYSTORE_FILE=
          if [[ "$UPLOAD_SIGNING" == true ]]; then
            export PARKPING_UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/park-ping-upload.p12"
            export PARKPING_UPLOAD_KEYSTORE_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD"
            export PARKPING_UPLOAD_KEY_ALIAS="$UPLOAD_KEY_ALIAS"
            export PARKPING_UPLOAD_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD"
          fi
          ./gradlew --no-daemon :app:bundleRelease
          bundle="app/build/outputs/bundle/release/app-release.aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle"
          if [[ "$UPLOAD_SIGNING" == true ]]; then
            if ! unzip -Z1 "$bundle" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
              echo 'Release AAB has no signing certificate.' >&2
              exit 1
            fi
            jarsigner -verify "$bundle"
            java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
              --bundle="$bundle" \
              --output="$RUNNER_TEMP/park-ping.apks" \
              --mode=universal \
              --ks="$RUNNER_TEMP/park-ping-upload.p12" \
              --ks-key-alias="$UPLOAD_KEY_ALIAS" \
              --ks-pass=env:UPLOAD_KEYSTORE_PASSWORD \
              --key-pass=env:UPLOAD_KEY_PASSWORD
            unzip -p "$RUNNER_TEMP/park-ping.apks" universal.apk > dist/artifact/park-ping-play-universal.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/artifact/park-ping-play-universal.apk
            cp "$bundle" dist/release/park-ping-play.aab
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
              -n park-ping-release-check \
              -k 'system-images;android-35;google_apis;x86_64' --force
            "$ANDROID_HOME/emulator/emulator" -avd park-ping-release-check \
              -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot \
              > "$RUNNER_TEMP/emulator.log" 2>&1 &
            booted=false
            for attempt in {1..60}; do
              if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
                booted=true
                break
              fi
              sleep 5
            done
            if [[ "$booted" != true ]]; then
              cat "$RUNNER_TEMP/emulator.log"
              echo 'Android emulator did not finish booting.' >&2
              exit 1
            fi
            adb install dist/artifact/park-ping-play-universal.apk
            adb shell monkey -p uk.co.collom.parkping 1
          else
            cp "$bundle" dist/artifact/park-ping-unsigned.aab
          fi
          (
            cd dist/release
            if [[ -f park-ping-play.aab ]]; then
              sha256sum *.apk *.aab > SHA256SUMS
            else
              sha256sum *.apk > SHA256SUMS
            fi
          )
      - uses: actions/upload-artifact@v4
        with:
          name: park-ping-tagged-apk-${{ github.run_number }}
          path: |
            dist/release/*
            dist/artifact/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish test release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PERSISTENT_SIGNING: ${{ steps.signing.outputs.persistent }}
          UPLOAD_SIGNING: ${{ steps.upload-signing.outputs.persistent }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Park Ping Android test build. Includes the APK and SHA-256 checksum.

          Download the APK on your Android phone, open it and permit installation from that source if prompted. Phone testing of permissions, layout and screen-off monitoring is still required.
          NOTES
          if [[ "$PERSISTENT_SIGNING" == true ]]; then
            printf '\nSigned using the configured persistent signing key.\n' >> "$RUNNER_TEMP/release-notes.md"
          else
            printf '\nDevelopment signing: a new key is generated for this workflow run. You may need to uninstall an earlier version before installing this build; uninstalling removes local favourites and alert settings. Configure the four PARKPING signing secrets for consistent updates.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          if [[ "$UPLOAD_SIGNING" == true ]]; then
            printf '\nIncludes park-ping-play.aab signed with the configured Play upload key. The AAB still requires Play App Signing enrollment and a successful internal-track upload.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/release/* --verify-tag --prerelease \
              --title "Park Ping $RELEASE_TAG — Android test build" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/park-ping.keystore" "$RUNNER_TEMP/park-ping-upload.p12" "$RUNNER_TEMP/bundletool.jar"
