version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-routine:
        applies-to: version-updates
        patterns: ['*']
      gradle-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
