name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Reports are public. Do not include passwords, signing keys, precise location history, or unnecessary personal information.
  - type: input
    id: app-version
    attributes:
      label: Park Ping app version
      description: Find this in the release name or app listing.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Find it in your phone's Settings under About phone.
      placeholder: Android 15
    validations:
      required: true
  - type: dropdown
    id: park
    attributes:
      label: Selected park
      options:
        - Magic Kingdom
        - EPCOT
        - Hollywood Studios
        - Animal Kingdom
        - Disneyland Paris
        - Disney Adventure World
        - Universal Studios Florida
        - Islands of Adventure
        - Epic Universe
        - Not applicable / other
    validations:
      required: true
  - type: input
    id: timestamp
    attributes:
      label: When did it happen?
      description: Include the date, time and timezone (for example, 2026-10-08 13:15 UTC).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the behaviour you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include steps to reproduce if useful. Do not attach data containing precise location history or personal information.
    validations:
      required: true
